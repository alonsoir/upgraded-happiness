version: "3.9"

services:
  etcd:
    image: registry.k8s.io/etcd:3.5.16-0
    container_name: etcd
    ports:
      - "2379:2379"
      - "2380:2380"
    command: >
      /usr/local/bin/etcd
      --name s1
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://0.0.0.0:2379
      --listen-peer-urls http://0.0.0.0:2380
      --initial-advertise-peer-urls http://0.0.0.0:2380
      --initial-cluster s1=http://0.0.0.0:2380
      --initial-cluster-token tkn
      --initial-cluster-state new
    volumes:
      - etcd_data:/etcd-data

  sniffer:
    image: upgraded-happiness/sniffer:v3.1-etcd
    container_name: sniffer
    depends_on:
      - etcd
    volumes:
      - ./config:/app/config
    command: >
      python /app/simple_sniffer.py /app/config/sniffer_config.json

  simple-firewall-agent:
    image: upgraded-happiness/simple-firewall-agent:v3.1-etcd
    container_name: simple-firewall-agent
    depends_on:
      - etcd
    volumes:
      - ./config:/app/config
    command: >
      python /app/simple_firewall_agent_v31_etcd.py /app/config/simple_firewall_agent_config.json /app/config/firewall_rules.json

  scheduler-firewall:
    image: upgraded-happiness/scheduler-firewall:v3.1-etcd
    container_name: scheduler-firewall
    depends_on:
      - etcd
    volumes:
      - ./config:/app/config
    command: >
      python /app/scheduler_firewall.py /app/config/scheduler_firewall_config.json

  ml-detector:
    image: upgraded-happiness/ml-detector:v3.1-etcd
    container_name: ml-detector
    depends_on:
      - etcd
    volumes:
      - ./config:/app/config
    command: >
      python /app/ml_detector.py /app/config/ml_detector_config.json

  geoip:
    image: upgraded-happiness/geoip:v3.1-etcd
    container_name: geoip
    depends_on:
      - etcd
    volumes:
      - ./config:/app/config
    command: >
      python /app/geoip_service.py /app/config/geoip_config.json

  dashboard:
    image: upgraded-happiness/dashboard:v3.1-etcd
    container_name: dashboard
    depends_on:
      - etcd
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
    command: >
      python /app/dashboard.py /app/config/dashboard_config.json

volumes:
  etcd_data:
