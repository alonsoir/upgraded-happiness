# =============================================================================
# UPGRADED HAPPINESS V3.1 ETCD - Docker Compose with AppArmor Security
# =============================================================================
# All paths, commands, and security contexts corrected
# AppArmor profiles applied for enhanced container security
# =============================================================================

services:
  # =============================================================================
  # ETCD Cluster - Distributed Key-Value Store
  # =============================================================================
  etcd:
    image: registry.k8s.io/etcd:3.5.16-0
    container_name: etcd
    hostname: etcd
    ports:
      - "12379:2379"
      - "12380:2380"
    command: >
      /usr/local/bin/etcd
      --name s1
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://etcd:2379
      --listen-peer-urls http://0.0.0.0:2380
      --initial-advertise-peer-urls http://etcd:2380
      --initial-cluster s1=http://etcd:2380
      --initial-cluster-token upgraded-happiness-cluster-token
      --initial-cluster-state new
      --data-dir /etcd-data
    volumes:
      - etcd_data:/etcd-data
    networks:
      - upgraded-happiness-network
    security_opt:
      - apparmor:docker-default
    read_only: false
    tmpfs:
      - /tmp:exec,nodev,nosuid,size=100m
    healthcheck:
      test: [ "CMD", "etcdctl", "endpoint", "health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped


  # =============================================================================
  # SNIFFER - Network Packet Capture Component
  # =============================================================================
  sniffer:
    image: upgraded-happiness/sniffer:v3.1-etcd
    container_name: sniffer
    hostname: sniffer
    depends_on:
      etcd:
        condition: service_healthy
    environment:
      - ETCD_ENDPOINT=http://etcd:2379
      - NODE_ID=sniffer_v31_etcd_001
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    command: >
      python /app/evolutionary_sniffer_standalone.py 
      /app/config/json/sniffer_config_docker.json
    volumes:
      - sniffer_logs:/app/logs:rw
      - sniffer_data:/app/data:rw
    networks:
      - upgraded-happiness-network
    security_opt:
      - apparmor:docker-default
    read_only: false
    tmpfs:
      - /tmp:noexec,nodev,nosuid,size=50m
    # user: "1001:1001"  # COMENTADO - necesita root para packet capture
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - NET_ADMIN
    healthcheck:
      test: [ "CMD-SHELL", "python -c 'import sys; sys.exit(0)'" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # =============================================================================
  # GEOIP ENRICHER - IP Geolocation Service
  # =============================================================================
  geoip:
    image: upgraded-happiness/geoip:v3.1-etcd
    container_name: geoip
    hostname: geoip
    depends_on:
      etcd:
        condition: service_healthy
    environment:
      - ETCD_ENDPOINT=http://etcd:2379
      - NODE_ID=geoip_enricher_v31_etcd_001
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    # CORRECTED: Real executable and config paths
    command: >
      python /app/geoip_enricher_v31_etcd.py 
      /app/config/json/geoip_config_docker.json
    volumes:
      - geoip_logs:/app/logs:rw
      - geoip_data:/app/data:rw
    networks:
      - upgraded-happiness-network
    security_opt:
      - apparmor:docker-default
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nodev,nosuid,size=50m
    user: "1001:1001"
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import sys; sys.exit(0)'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # =============================================================================
  # ML DETECTOR - Machine Learning Tricapa V3.1
  # =============================================================================
  ml-detector:
    image: upgraded-happiness/ml-detector:v3.1-etcd
    container_name: ml-detector
    hostname: ml-detector
    depends_on:
      etcd:
        condition: service_healthy
      geoip:
        condition: service_healthy
    environment:
      - ETCD_ENDPOINT=http://etcd:2379
      - NODE_ID=ml_detector_tricapa_v31_etcd_001
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
    # CORRECTED: Real executable and config paths
    command: >
      python /app/lightweight_ml_detector_tricapa_v31_etcd.py 
      /app/config/json/ml_detector_config_docker.json
    volumes:
      - ml_detector_logs:/app/logs:rw
      - ml_detector_data:/app/data:rw
    networks:
      - upgraded-happiness-network
    security_opt:
      - apparmor:docker-default
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nodev,nosuid,size=200m  # Larger for ML operations
    user: "1002:1002"
    cap_drop:
      - ALL
    # Resource limits for ML workload
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import sys; sys.exit(0)'"]
      interval: 45s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # =============================================================================
  # SCHEDULER FIREWALL - Core Decision Engine
  # =============================================================================
  scheduler-firewall:
    image: upgraded-happiness/scheduler:v3.1-etcd
    container_name: scheduler-firewall
    hostname: scheduler-firewall
    depends_on:
      etcd:
        condition: service_healthy
      ml-detector:
        condition: service_healthy
    environment:
      - ETCD_ENDPOINT=http://etcd:2379
      - NODE_ID=scheduler_firewall_v31_etcd_001
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    # CORRECTED: Real executable and DUAL config paths
    command: >
      python /app/scheduler_firewall_v31_etcd.py 
      /app/config/json/scheduler_firewall_config_docker.json
      /app/config/json/firewall_rules_scheduler_config_docker.json
    volumes:
      - scheduler_logs:/app/logs:rw
      - scheduler_data:/app/data:rw
    networks:
      - upgraded-happiness-network
    security_opt:
      - apparmor:docker-default
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nodev,nosuid,size=100m
    user: "1002:1002"
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import sys; sys.exit(0)'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # =============================================================================
  # SIMPLE FIREWALL AGENT - Network Security Enforcement
  # =============================================================================
  simple-firewall-agent:
    image: upgraded-happiness/simple-firewall-agent:v3.1-etcd
    container_name: simple-firewall-agent
    hostname: simple-firewall-agent
    depends_on:
      etcd:
        condition: service_healthy
      scheduler-firewall:
        condition: service_healthy
    environment:
      - ETCD_ENDPOINT=http://etcd:2379
      - NODE_ID=simple_firewall_agent_001
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    # CORRECTED: Real executable and DUAL config paths
    command: >
      python /app/simple_firewall_agent_v31_etcd.py 
      /app/config/json/simple_firewall_agent_config_docker.json
      /app/config/json/firewall_rules_simple_agent_config_docker.json
    volumes:
      - firewall_logs:/app/logs:rw
      - firewall_data:/app/data:rw
    networks:
      - upgraded-happiness-network
    security_opt:
      - apparmor:docker-default
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nodev,nosuid,size=50m
    user: "1002:1002"
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN  # Required for iptables operations
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import sys; sys.exit(0)'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # =============================================================================
  # DASHBOARD - Web Interface and Fleet Management
  # =============================================================================
  dashboard:
    image: upgraded-happiness/dashboard:v3.1-etcd
    container_name: dashboard
    hostname: dashboard
    depends_on:
      etcd:
        condition: service_healthy
      ml-detector:
        condition: service_healthy
      simple-firewall-agent:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - ETCD_ENDPOINT=http://etcd:2379
      - NODE_ID=dashboard_main_v31_etcd_001
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - DASHBOARD_DATA_PATH=/app/data/dashboard
    # CORRECTED: Real executable and DUAL config paths (validated in integration tests)
    command: >
      python /app/dashboard_v31_etcd.py 
      /app/config/json/dashboard_config_docker.json
      /app/config/json/firewall_rules_dashboard_config_docker.json
    volumes:
      - dashboard_logs:/app/logs:rw
      - dashboard_data:/app/data:rw
    networks:
      - upgraded-happiness-network
    security_opt:
      - apparmor:docker-default
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nodev,nosuid,size=100m
    user: "1000:1000"
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/api/metrics')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    restart: unless-stopped

# =============================================================================
# NETWORKS - Isolated network for secure communication
# =============================================================================
networks:
  upgraded-happiness-network:
    driver: bridge
    name: upgraded-happiness-network
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
    driver_opts:
      com.docker.network.bridge.name: uh-bridge
      com.docker.network.driver.mtu: 1500

# =============================================================================
# VOLUMES - Persistent storage for each component
# =============================================================================
volumes:
  # ETCD persistent storage
  etcd_data:
    driver: local
    name: upgraded-happiness-etcd-data

  # Component logs (separate volumes for security isolation)
  sniffer_logs:
    driver: local
    name: upgraded-happiness-sniffer-logs
  geoip_logs:
    driver: local
    name: upgraded-happiness-geoip-logs
  ml_detector_logs:
    driver: local
    name: upgraded-happiness-ml-detector-logs
  scheduler_logs:
    driver: local
    name: upgraded-happiness-scheduler-logs
  firewall_logs:
    driver: local
    name: upgraded-happiness-firewall-logs
  dashboard_logs:
    driver: local
    name: upgraded-happiness-dashboard-logs

  # Component data storage
  sniffer_data:
    driver: local
    name: upgraded-happiness-sniffer-data
  geoip_data:
    driver: local
    name: upgraded-happiness-geoip-data
  ml_detector_data:
    driver: local
    name: upgraded-happiness-ml-detector-data
  scheduler_data:
    driver: local
    name: upgraded-happiness-scheduler-data
  firewall_data:
    driver: local
    name: upgraded-happiness-firewall-data
  dashboard_data:
    driver: local
    name: upgraded-happiness-dashboard-data

# =============================================================================
# SECURITY NOTES:
# - All containers run as non-root users (UIDs from Dockerfiles)
# - AppArmor docker-default profile applied to all containers
# - no-new-privileges prevents privilege escalation
# - read-only filesystems with tmpfs for temporary files
# - Minimal capabilities (ALL dropped, specific ones added only when needed)
# - Health checks for all services
# - Isolated network with custom subnet
# - Persistent volumes for logs and data
# - Resource limits for ML detector to prevent resource exhaustion
# =============================================================================

